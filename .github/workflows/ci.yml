name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Format
        if: runner.os == 'Linux'
        run: test -z "$(gofmt -l .)" || { gofmt -l .; exit 1; }
      - run: go vet ./...
      - name: Cross-compile
        if: runner.os == 'Linux'
        run: |
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            GOOS="${target%/*}" GOARCH="${target#*/}" go build -o /dev/null ./cmd/wok
          done
      - name: Unit tests
        run: go test -race ./...
      - name: Browser integration
        run: |
          go build -o bin/wok"$(go env GOEXE)" ./cmd/wok
          browser="$(./bin/wok browser install | jq -r .path)"
          test -f "$browser"
          WOK_TEST_BROWSER="$browser" go test -race ./integration ./internal/browser -count=1
      - name: Install scripts
        if: runner.os != 'Windows'
        run: sh -n install.sh
