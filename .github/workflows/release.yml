name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go vet ./...
      - run: go test -race ./...
      - name: Build archives
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eu
          mkdir -p dist
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64 windows/arm64; do
            os="${target%/*}"
            arch="${target#*/}"
            name="wok_${VERSION#v}_${os}_${arch}"
            exe=""
            [ "$os" = windows ] && exe=".exe"
            mkdir -p "build/$name"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X github.com/alg0rix/wok/internal/version.Version=$VERSION" \
              -o "build/$name/wok$exe" ./cmd/wok
            cp README.md LICENSE "build/$name/"
            if [ "$os" = windows ]; then
              (cd build && zip -qr "../dist/$name.zip" "$name")
            else
              tar -C build -czf "dist/$name.tar.gz" "$name"
            fi
          done
          (cd dist && sha256sum wok_* > checksums.txt)
          cp install.sh install.ps1 dist/
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ github.ref_name }}
        run: gh release create "$VERSION" dist/* --title "Wok $VERSION" --generate-notes --verify-tag
